<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="css/pico.red.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <title>NTP/RTC LED clock</title>
  </head>
  <body></body> <!-- style="visibility: hidden;"> -->
    <!-- Fix for firefox to prevent flash of unstyled content-->
    <script>0</script>
    <main class="container bottom-line">
      <nav class="bottom-line">
          <ul>
            <li><h3>Settings</h3></li>
        </ul>
        <ul>
          <li><a href="wireless.html">Wirelesst</a></li>
          <li><a href="about.html">About</a></li>
       </ul>
      </nav>
      <div class="grid">
        <article>
          <header>
            <h4>General</h4>
          </header>
          <fieldset>
            <label for="ntp_update">Periodicly update time from the internet
            </label>
            <input type="checkbox" role="switch" id="ntp_update" 
              name="ntp_update" onchange="toggle_ntp(this)"/><br><br>
            <label for="brightness">Brightness:</label><br>
            <input type="range" min="1" max="7" value="4" class="slider"
              id="brightness" onchange="post_config()"><br>
          </fieldset>
          <p><b>IP: </b><span id="ip"></span></p>
          <p><b>Hostname: </b><span id="hostname"></span></p>
          <p><b>SSID: </b><span id="ssid"></span></p>
        </article>
          
        <article id="ntp_card">
          <header>
            <h4>NTP</h4>
          </header>
          <form action="">
          <label for="server">Server: </label>
          <input type="text" id="server" name="server" value="pool.ntp.org" oninput="post_config()">
          <label for="tz">Time zone:</label>
          <select id="tz" onchange="post_config()" required>
          <script type="text/javascript">
            fetch('js/zones.json')
              .then(function (response)
              {
                return response.json();
              })
              .then(function (zones)
              {
               appendData(zones);
              })
              .catch(function (err)
              {
               console.log('Something went wrong loading timezone data: ' + err);
              });

            function appendData(zones)
            {
              let select_tag = document.getElementById("tz");
              
              for (let key in zones)
              {
                if (zones.hasOwnProperty(key))
                {
                  let opt = document.createElement("option");
                  opt.value = zones[key];
                  opt.text = key;
                  select_tag.add(opt);
                }
              }  
            }
          </script>
          </select>
        </form>
      </article>

      <article id="time_card">
        <header>
          <h4>Time</h4>
        </header>
          <form action="">
            <label for="time">Time: </label>
            <input type="time" id="time" name="time" onchange="post_config()"><br>
            <label for="date">Date: </label>
            <input type="date" id="date" name="date" onchange="post_config()"><br>
          </form>
      </article>            
    </div>
    <article id="state"><br></article>   
  </main>
  <footer class="container tighten">
     <small><span class="copyright">&copy; Copyright 2022-26 Martin Bo Kristensen Gr&oslash;nholdt.</span></small>
  </footer>
  <script type="text/javascript">
    // TODO: remove console log statements before 1.0.0
    var config_data = {};

    //Send data if config_proxy is changed
    var config_proxy = new Proxy(config_data, {
      get: function(target, prop) {
        return Reflect.get(target, prop);
      },
      set: function(target, prop, value) {
        post_config();
        return Reflect.set(target, prop, value);
      }
    });

    function toggle_ntp(src)
    {
      let ntp_card = document.getElementById("ntp_card");
      let time_card = document.getElementById("time_card");

      if (src.checked === true)
      {
        time_card.style.display = "none";                
        ntp_card.style.display = "block";
      }
      else 
      {
        ntp_card.style.display = "none";
        time_card.style.display = "block";
      }
      
      config_proxy.ntp_en = src.checked;
    }
    
    function config_listener()
    {
      config_data = JSON.parse(this.responseText);

      //Switch between local RTC and NTP cards
      var ntp_card = document.getElementById("ntp_card");
      var time_card = document.getElementById("time_card");
      if (config_data.ntp__en === true)
      {
        ntp_card.style.display = "block";
        time_card.style.display = "none";
      }
      else 
      {
        ntp_card.style.display = "none";
        time_card.style.display = "block";
      }

      //Update NTP checkbox
      document.getElementById("ntp_update").checked = config_data.ntp_en;       
      //Update brightness slider
      document.getElementById("brightness").value = config_data.brightness;
      //Update IP address
      document.getElementById("ip").innerText = config_data.ip;
      //Update IP hostname
      document.getElementById("hostname").innerText = config_data.hostname;
      //Update IP SSID
      document.getElementById("ssid").innerText = config_data.ssid;
      //Set timezone selection index.
      document.getElementById("tz").selectedIndex = config_data.tz_index;
      //No reason to get the 'tz_value', as the index should be enough.
      //Update NTP server address
      document.getElementById("server").value = config_data.ntp_server;
      //Update time
      document.getElementById("time").value = config_data.time;     
    }

    function get_config()
	  {
			var xhttp = new XMLHttpRequest();

      xhttp.addEventListener("load", config_listener);
		
      xhttp.onreadystatechange = function()
			{
				var state = document.getElementById("state");
	
        if (this.readyState == 4 && this.status == 200)
				{
					state.className = "message success";
					state.innerHTML = "<small><strong>Done!</strong> Read configuration.</small>";
        }
				else if (this.readyState == 4 && this.status != 200)
				{
					state.className = "message error";
          state.innerHTML = "<small><strong>Error!</strong> Failed to read configuration (" + this.status + ").</small>";
        }
      };
      xhttp.open("GET", 'http://' + window.location.hostname +':' + window.location.port + '/config', true);
      xhttp.send();
		}

    function post_config()
	  {
			var xhttp = new XMLHttpRequest();

      //Update from NTP checkbox
      config_data.ntp_en = document.getElementById("ntp_update").checked;
      //Update from brightness slider
      config_data.brightness = document.getElementById("brightness").value;
      //Update NTP server address
      config_data.ntp_server = document.getElementById("server").value;  
      //Set timezone selection index.
      config_data.tz_index = document.getElementById("tz").selectedIndex;
      //Set timezone string
      config_data.tz_value = document.getElementById("tz").value;
		
      xhttp.onreadystatechange = function()
			{
				var state = document.getElementById("state");
	
        if (this.readyState == 4 && this.status == 200)
				{
					state.className = "message success";
					state.innerHTML = "<strong>Done!</strong> Sent configuration.";
        }
				else if (this.readyState == 4 && this.status != 200)
				{
					state.className = "message error";
          state.innerHTML = "<strong>Error!</strong> Failed to sent configuration  (" + this.status + ").";
        }
      };
      xhttp.open("POST", 'http://' + window.location.hostname +':' + window.location.port + '/config', true);
      xhttp.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
      xhttp.send(JSON.stringify(config_data)); 
    }

    let domReady = (cb) => {
      document.readyState === 'interactive' || document.readyState === 'complete'
      ? cb() 
      : document.addEventListener('DOMContentLoaded', cb);
    };

    domReady(() => {
      get_config();
      // Display body when DOM is loaded
      document.body.style.visibility = 'visible';
    });
	</script>
  <noscript><style>body { visibility: visible; }</style>Sorry, JavaScript is 
    needed for the functionality of this page!</noscript>
  </body>
</html>
