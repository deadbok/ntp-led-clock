<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark" />
    <link rel="stylesheet" href="css/pico.red.min.css">
    <link rel="stylesheet" href="css/custom.css">
    <title>NTP/RTC LED clock</title>
  </head>
  <body></body> <!-- style="visibility: hidden;"> -->
    <!-- Fix for firefox to prevent flash of unstyled content-->
    <script>0</script>
    <main class="container bottom-line">
      <nav class="bottom-line">
        <ul>
          <li><h3>Wireless</h3></li>
        </ul>
        <ul>
          <li><a href="index.html">Settings</a></li>
          <li><a href="about.html">About</a></li>
       </ul>
      </nav>
      <div class="grid">
        <fieldset>
          <label for="ssids">Network name:</label>
          <select id="ssids" onchange="postConfig()" required></select>
          <label for="ip">IP address: </label>
          <input type="text" oninput="postConfig()" id="ip" name="ip">
          <label for="hostname">Hostname: </label>
          <input type="text" oninput="postConfig()" id="hostname" 
            name="hostname">          
        </fieldset>
      </div>
    <article id="state" class="message"><br></article>   
  </main>
  <footer class="container tighten">
     <small><span class="copyright">&copy; Copyright 2022-26 Martin Bo Kristensen Gr&oslash;nholdt.</span></small>
  </footer>
  <script type="text/javascript">
    // TODO: remove console log statements before 1.0.0
    var configData = {};

    function configListener()
    {
      configData = JSON.parse(this.responseText);

      //Update IP address
      document.getElementById("ip").value = configData.ip;
      //Update hostname
      document.getElementById("hostname").value = configData.hostname;
      //Update SSID
      document.getElementById("ssids").value = configData.ssid;
    }

    function getConfig()
	  {
			var xhttp = new XMLHttpRequest();

      xhttp.addEventListener("load", configListener);
		
      xhttp.onreadystatechange = function()
			{
				var state = document.getElementById("state");
	
        if (this.readyState == 4 && this.status == 200)
				{
					state.className = "message success";
					state.innerHTML = "<small><strong>Done!</strong> Read configuration.</small>";
        }
				else if (this.readyState == 4 && this.status != 200)
				{
					state.className = "message error";
          state.innerHTML = "<small><strong>Error!</strong> Failed to read configuration (" + this.status + ").</small>";
        }
      };
      xhttp.open("GET", 'http://' + window.location.hostname +':' + window.location.port + '/config', true);
      xhttp.send();
		}

    function postConfig()
	  {
			var xhttp = new XMLHttpRequest();

      //Update from SSIDs select
      configData.ssid = document.getElementById("ssids").value;
      //Update IP from text box
      configData.ip = document.getElementById("ip").value;
      //Update hostname from text box
      configData.hostname = document.getElementById("hostname").value;  
		
      xhttp.onreadystatechange = function()
			{
				var state = document.getElementById("state");
	
        if (this.readyState == 4 && this.status == 200)
				{
					state.className = "message success";
					state.innerHTML = "<strong>Done!</strong> Sent configuration.";
        }
				else if (this.readyState == 4 && this.status != 200)
				{
					state.className = "message error";
          state.innerHTML = "<strong>Error!</strong> Failed to sent configuration  (" + this.status + ").";
        }
      };
      xhttp.open("POST", 'http://' + window.location.hostname +':' + window.location.port + '/config', true);
      xhttp.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
      xhttp.send(JSON.stringify(configData)); 
      console.log(JSON.stringify(configData));
    }

    function SSIDsListener()
    {
      let ssids = JSON.parse(this.responseText);
      let selectTag = document.getElementById("ssids");

      ssids.forEach(function(item)
      {
        let opt = document.createElement("option");
        opt.text = item;
        opt.value = item;
        selectTag.add(opt);
      });
    }

    function getSSIDs()
	  {
			var xhttp = new XMLHttpRequest();

      xhttp.addEventListener("load", SSIDsListener);
		
      xhttp.onreadystatechange = function()
			{
				var state = document.getElementById("state");
	
        if (this.readyState == 4 && this.status == 200)
				{
					state.className = "message success";
					state.innerHTML = "<small><strong>Done!</strong> Got SSIDs.</small>";
        }
				else if (this.readyState == 4 && this.status != 200)
				{
					state.className = "message error";
          state.innerHTML = "<small><strong>Error!</strong> Failed to get SSIDs (" + this.status + ").</small>";
        }
      };
      xhttp.open("GET", 'http://' + window.location.hostname +':' + window.location.port + '/ssids', true);
      xhttp.send();
		}

    let domReady = (cb) => {
      document.readyState === 'interactive' || document.readyState === 'complete'
      ? cb() 
      : document.addEventListener('DOMContentLoaded', cb);
    };

    domReady(() => {
      getSSIDs();
      getConfig();
      // Display body when DOM is loaded
      document.body.style.visibility = 'visible';
    });
	</script>
  <noscript><style>body { visibility: visible; }</style>Sorry, JavaScript is needed for the functionality of this page!</noscript>
  </body>
</html>
