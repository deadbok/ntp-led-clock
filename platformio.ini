; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:lolin32]
platform = espressif32
board = lolin32
framework = arduino
build_type = debug
build_flags = -Wall -D_BSD_SOURCE ;-DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
board_build.filesystem = littlefs
#upload_port = /dev/ttyUSB1
monitor_speed = 115200
monitor_filters = log2file, esp32_exception_decoder
#extra_scripts = tools/pioscripts/reset.py ;Does not work...
lib_deps = 
	akj7/TM1637 Driver@^2.2.1
	makuna/RTC@^2.4.3
	bblanchon/ArduinoJson@^7.0.4

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino
build_type = debug
build_flags = -Wall -D_BSD_SOURCE
lib_deps = 
	khoih-prog/ESP8266TimerInterrupt@^1.6.0
	khoih-prog/TimerInterrupt_Generic@^1.13.0
	akj7/TM1637 Driver@^2.2.1
	makuna/RTC@^2.4.3
	bblanchon/ArduinoJson@^7.0.4
board_build.filesystem = littlefs
upload_port = /dev/ttyUSB1
monitor_speed = 115200
monitor_filters = log2file, esp8266_exception_decoder

[env:lolin32-OTA]
upload_protocol = espota
upload_port = 192.168.0.215
platform = espressif32
board = lolin32
framework = arduino
build_type = debug
build_flags = -Wall -D_BSD_SOURCE
board_build.filesystem = littlefs
lib_deps = 
	akj7/TM1637 Driver@^2.2.1
	makuna/RTC@^2.4.3
	bblanchon/ArduinoJson@^7.0.4

